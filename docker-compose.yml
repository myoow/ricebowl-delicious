version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: ricebowl-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ricebowl_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: ricebowl-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:root@db:3306/ricebowl_db"
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - backend_uploads:/app/public/uploads
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ../frontend-ricebowl
    container_name: ricebowl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend-ricebowl:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
  backend_uploads:

